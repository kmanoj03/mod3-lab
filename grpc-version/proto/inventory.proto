syntax = "proto3";

package inventory.v1;

// Checks whether a requested item and quantity are available.
//
// Errors (gRPC status codes):
//   INVALID_ARGUMENT    - item_id empty or quantity <= 0
//   NOT_FOUND           - item_id does not exist
//   FAILED_PRECONDITION - item exists but not enough stock
service InventoryService {
  rpc CheckInventory(CheckInventoryRequest) returns (CheckInventoryResponse);
}

message CheckInventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CheckInventoryResponse {
  string item_id = 1;
  int32 requested_quantity = 2;
  int32 available_quantity = 3;
  bool available = 4;
}
